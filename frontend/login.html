<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Reservas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-container">

        <p id="mensaje"></p>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
