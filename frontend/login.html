<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Reservas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .rol-info {
            text-align: center;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #5a67d8;
        }
        .mensaje {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
        .volver {
            text-align: center;
            margin-top: 15px;
        }
        .volver a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Sistema de Reservas</h2>
        
        <div class="rol-info" id="rolInfo">
            Cargando...
        </div>
        
        <input type="text" id="correo" placeholder="Correo electrónico">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="hacerLogin()">Iniciar Sesión</button>
        <div id="mensaje" class="mensaje"></div>
        
        <div class="volver">
            <a href="index.html">← Volver a seleccionar rol</a>
        </div>
    </div>

    <script>
        // Recuperar el rol seleccionado en index.html
        let rolSeleccionado = localStorage.getItem('rolSeleccionado');
        
        // Mostrar información del rol en la página
        const rolInfo = document.getElementById('rolInfo');
        if (rolSeleccionado === 'admin') {
            rolInfo.textContent = '🔐 Iniciando sesión como ADMINISTRADOR';
            rolInfo.style.background = '#e8e0ff';
            rolInfo.style.color = '#764ba2';
        } else if (rolSeleccionado === 'usuario') {
            rolInfo.textContent = '👤 Iniciando sesión como USUARIO';
            rolInfo.style.background = '#e0f0ff';
            rolInfo.style.color = '#667eea';
        } else {
            // Si no hay rol seleccionado, redirigir a index
            window.location.href = 'index.html';
        }
        
        async function hacerLogin() {
            const correo = document.getElementById('correo').value;
            const password = document.getElementById('password').value;
            const mensajeDiv = document.getElementById('mensaje');
            
            if (!correo || !password) {
                mensajeDiv.textContent = 'Por favor ingrese todos los campos';
                mensajeDiv.style.color = 'red';
                return;
            }
            
            mensajeDiv.textContent = 'Conectando...';
            mensajeDiv.style.color = 'blue';
            
            const formData = new URLSearchParams();
            formData.append('username', correo);
            formData.append('password', password);
            
            try {
                const response = await fetch('http://localhost:8000/auth/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData
                });
                
                console.log('Respuesta:', response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('Token recibido:', data);
                    
                    // Guardar token y rol en localStorage
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('rol', rolSeleccionado);  // ← GUARDAR EL ROL
                    
                    mensajeDiv.textContent = 'Login exitoso! Redirigiendo...';
                    mensajeDiv.style.color = 'green';
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    const error = await response.json();
                    mensajeDiv.textContent = error.detail || 'Error de autenticación';
                    mensajeDiv.style.color = 'red';
                }
            } catch (error) {
                console.error('Error:', error);
                mensajeDiv.textContent = 'Error al conectar con el servidor';
                mensajeDiv.style.color = 'red';
            }
        }
    </script>
</body>
</html>
