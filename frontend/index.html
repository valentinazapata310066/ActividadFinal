<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reservas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        p {
            color: #888;
            margin-bottom: 40px;
            font-size: 15px;
        }

        .btn-admin {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            transition: opacity 0.2s;
        }

        .btn-admin:hover { opacity: 0.9; }

        .btn-usuario {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: white;
            color: #333;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 30px;
            transition: border-color 0.2s;
        }

        .btn-usuario:hover { border-color: #667eea; }

        .footer {
            color: #aaa;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏛️</div>
        <h1>Bienvenido al Sistema de Reservas</h1>
        <p>¿Cómo deseas acceder hoy?</p>

        <button class="btn-admin" onclick="irAdmin()">
            🛡️ Iniciar como Administrador
        </button>

        <button class="btn-usuario" onclick="irUsuario()">
            👤 Iniciar como Usuario
        </button>

        <div class="footer">Selecciona tu perfil para continuar</div>
    </div>

    <script>
        function irAdmin() {
            localStorage.setItem('rolSeleccionado', 'admin')
            window.location.href = 'login.html'
        }

        function irUsuario() {
            localStorage.setItem('rolSeleccionado', 'usuario')
            window.location.href = 'login.html'
        }
    </script>
</body>
</html>
